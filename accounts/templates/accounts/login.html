{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6 col-lg-5">
<h1>Log in</h1>
<form method="post">{% csrf_token %}
  {% include "accounts/_form.html" with form=form %}
  <button class="btn btn-primary">Log in</button>
</form>
<p class="mt-3">No account? <a href="{% url 'accounts:register' %}">Register</a></p>
</div></div>
{% endblock %}
